name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  train-and-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (downloads data and trains the model)
        run: docker build -t bangla-news-classifier .
      - name: Smoke test the API
        run: |
          docker run -d -p 8000:8000 bangla-news-classifier
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/model
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"text":"ক্রিকেট ম্যাচে সেঞ্চুরি করলেন অধিনায়ক, সিরিজ জিতল দল"}' | grep '"label":"sports"'
